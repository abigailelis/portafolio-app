<div class="skills-box d-flex justify-content-between align-items-center flex-column">
    <h2>{{ title }}</h2>

    <div class="skills d-flex justify-content-between align-items-center">
        <div *ngFor="let skill of skills" class="skill d-flex justify-content-between align-items-center flex-column">
            <i class="{{ skill.class }}"></i>
            <p>{{ skill.name }}</p>
        </div>
    </div>
    
</div>
